// gPUteer — Lease 와 Fencing
//
// 규범 문서: docs/protocol/signing.md
// 설계 근거: gputeer_master_implementation_plan_v5.md §20.2
//
// ┌──────────────────────────────────────────────────────────────────────┐
// │ fencing의 정직한 경계  (ADR-025)                                     │
// │                                                                      │
// │  ✅ 강제 가능 — 우리가 만든 자원이라 watermark 검사를 넣을 수 있다   │
// │       Artifact Hub 쓰기 / CAS 등록 / canonical pointer / Lease 자체  │
// │                                                                      │
// │  ❌ 강제 불가 — 상대가 fence_epoch를 모른다                          │
// │       임의 외부 HTTP API / 외부 DB / 결제 / 메일 발송                │
// │       lease 만료 직전에 전송된 요청은 그대로 처리된다.               │
// │       네트워크 지연과 만료 사이에는 원천적 경합이 있다.              │
// │                                                                      │
// │  따라서 SIDE_EFFECTING Job의 중복 실행은 fencing으로 막을 수 없다.   │
// │  계획서 §15.6의 (a) 멱등키 / (b) 대행 / (c) 명시수락 중 하나를       │
// │  반드시 선택해야 한다.                                               │
// └──────────────────────────────────────────────────────────────────────┘

syntax = "proto3";

package gputeer.v1;

import "common.proto";

option go_package = "github.com/gputeer/gputeer/proto/v1;gputeerv1";

// ═══════════════════════════════════════════════════════════════════════
// Lease
// ═══════════════════════════════════════════════════════════════════════

message Lease {
  uint32 schema_version = 1; // 현재 1
  string lease_id = 2;
  string job_id = 3;
  string attempt_id = 4;

  // --- fencing ---
  // 팀 전역 단조 증가. ControlStore 커밋으로만 증가한다.
  // 새 Attempt 생성 시마다 증가한다. resource별이 아니라 team 전역이다.
  uint64 fence_epoch = 10;
  uint64 coordinator_term = 11;

  // --- 보유자 (v5 초안에 없었다) ---
  // 단일 노드 Job의 실행 노드.
  string holder_node_id = 20;
  // 분산 Job(Mode B/C)의 참여 노드 전체. holder_node_id를 포함한다.
  repeated string member_node_ids = 21;
  string issuing_coordinator_id = 22;

  // --- 수명 ---
  uint64 issued_at_unix_ms = 30;
  // 기본 issued_at + 10분.
  uint64 expires_at_unix_ms = 31;
  // 이 시각 이후 갱신 요청 가능. 기본 수명의 50% 지점.
  uint64 renew_after_unix_ms = 32;
  // 이 lease_id로 누적 가능한 최대 시간. 기본 24시간.
  // 초과하면 새 lease_id로 재발급해야 한다 (좀비 lease 방지).
  uint32 max_total_duration_seconds = 33;
  // ★ 2026-10-01 (schema v2) — 서명된 재배치 유예(밀리초). "Lease 만료 뒤 이만큼은 다른 노드에 다시 맡기지 않는다".
  //   채울 때만 schema_version 2. 재배치는 만료 + max(정책 유예, 이 값) 전에 다시 맡기지 않는다 — 노드는 이 값으로만
  //   "곧 끝나면 계속" 의 시한을 늘릴 수 있다. signing.md §6.8 · docs/contracts/proposals/2026-10-01_1126_서명된_재배치_유예_Lease_v2.md
  uint64 reassignment_grace_ms = 34;

  ResourceScope scope = 40;

  // domain_tag = "gputeer/v1/lease"
  bytes coordinator_signature = 90;
}

// ═══════════════════════════════════════════════════════════════════════
// 갱신 프로토콜 (v5 초안에 없었다)
// ═══════════════════════════════════════════════════════════════════════

message RenewLeaseRequest {
  uint32 schema_version = 1;
  string lease_id = 2;
  // 현재 보유 중인 epoch. 서버가 단조성을 확인한다.
  uint64 fence_epoch = 3;
  string node_id = 4;

  // 진행 상황 보고. Coordinator의 watchdog 판정 입력이 된다.
  ProgressReport progress = 10;

  uint64 issued_at_unix_ms = 20;
  bytes nonce = 21;
  // ★ 2026-10-01 (schema v2) — 미리 알린 끊김. "이 시각까지 Coordinator 와 연락이 안 될 것이다"(노드 벽시계 · 밀리초).
  //   채울 때만 schema_version 2. Coordinator 는 운영자 상한 · 작업 누적 상한 안에서만 Lease 를 늘려 서명한다 — 계속 돌 자격은 이 값이
  //   아니라 서명된 결과의 중첩 Lease 만료로만 생긴다. signing.md §6.7 · docs/contracts/proposals/2026-10-01_0024_미리_알린_끊김_Lease_연장.md
  uint64 unreachable_until_unix_ms = 22;
  // domain_tag = "gputeer/v1/lease-renew"
  bytes node_signature = 90;
}

message ProgressReport {
  uint64 current_step = 1;
  uint64 total_steps = 2;
  uint64 eta_seconds = 3;
  // 마지막으로 COMMITTED에 도달한 체크포인트의 step.
  uint64 last_committed_step = 4;
  // 현재 체크포인트 복제 백로그 바이트. 예산 모델 감시용.
  uint64 replication_backlog_bytes = 5;
}

// ★ 2026-08-19 — 인증 메타데이터 추가(docs/plans/2026-08-19_0500_...md).
//   원래 outcome/lease/detail/retry_after_ms 넷뿐이었고 서명이 없었다.
//   서명이 없으면 SUPERSEDED/QUARANTINED 같은 "정상 정책 거부"를
//   누구나 위조해 정당한 Agent 의 작업을 강제 중단시킬 수 있었다.
message RenewLeaseResult {
  RenewOutcome outcome = 1;
  // outcome == RENEWED 일 때만 채워진다. fence_epoch는 변하지 않는다.
  Lease lease = 2;
  string detail = 3;
  // outcome == UNAVAILABLE 일 때 재시도 권고 지연.
  uint32 retry_after_ms = 4;

  uint32 schema_version = 5;
  string coordinator_id = 6;
  uint64 issued_at_unix_ms = 7;
  // 요청 RenewLeaseRequest.nonce 를 그대로 echo 한다 — 결과가 다른
  // 갱신 요청에 재사용되는 것을 Agent 가 거부할 수 있게 한다.
  bytes request_nonce = 8;

  // domain_tag = "gputeer/v1/lease-renew-result"
  bytes coordinator_signature = 90;
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  // 코드 이름 MODE_MULTI_AGENT_GRANT. B+E(2026-09-14 결정 D2)로 순차 lane 도 이 Hello 로 시작한다.
  SESSION_MODE_FRESH = 1;
  SESSION_MODE_RESUME = 2;
  // ★ B+E 계약 단계 1 — 새 연결로 Lease 갱신만 한다: Hello -> RenewLeaseRequest -> RenewLeaseResult.
  SESSION_MODE_RENEW = 3;
  // ★ B+E 계약 단계 1 — 새 연결로 종료 보고만 한다: Hello -> AttemptReport -> AttemptReportAck.
  SESSION_MODE_REPORT = 4;
  // ★ 2026-10-02 대체 통지 우편함 v3 §2 — 새 연결로 우편함만 비운다: Hello -> MailboxDelivery -> MailboxAck -> MailboxAckReceipt.
  SESSION_MODE_MAILBOX = 5;
}

message AgentSessionHello {
  // 현재 1. GPU 관측(gpu_observation = 8)을 실을 때만 2 다(2026-09-25, 결함 301).
  uint32 schema_version = 1;
  SessionMode mode = 2;
  string session_id = 3;
  string node_id = 4;
  uint32 connection_attempt = 5;
  uint64 issued_at_unix_ms = 6;
  bytes nonce = 7;
  // ★ schema v2 · FRESH 에서만 (2026-09-25, 결함 301) — 노드가 NVML 로 직접 읽은 GPU 목록.
  //   Coordinator 는 등록된 선언과 **맞을 때만** "그 선언이 지금도 사실이다" 는 확인 기록을 남긴다(선언은 바꾸지 않는다).
  //   노드 자기보고다(WORKER_REPORTED) — 막는 것은 GPU 가 빠졌는데 선언이 신선하게 남는 것이지, 작정한 거짓이 아니다.
  //   v1 Hello 나 FRESH 가 아닌 Hello 에 이 칸이 있으면 거부한다(signing.md §6.6).
  NodeGpuObservation gpu_observation = 8;
  bytes node_signature = 90;
}

// 노드가 NVML 로 읽은 GPU 관측(결함 301). 서명하지 않는다 — 싣는 메시지(AgentSessionHello)의 서명이 묶는다.
message NodeGpuObservation {
  // 노드 시계로 NVML 을 읽은 때. Hello.issued_at 보다 늦거나 60초 넘게 이르면 확인에 쓰지 않는다.
  uint64 observed_at_unix_ms = 1;
  // uuid 오름차순 · 중복 없음 · 1~64 개.
  repeated ObservedGpu gpus = 2;
}

message ObservedGpu {
  // NVML UUID.
  string uuid = 1;
  // NVML 이름(예: "NVIDIA GeForce RTX 4070 SUPER"). 비어 있으면 거부한다.
  string model = 2;
  // NVML 총 VRAM. 0 이면 거부한다.
  uint64 total_vram_bytes = 3;
}

message ResumeLeaseRequest {
  uint32 schema_version = 1;
  string lease_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  string node_id = 5;
  uint64 fence_epoch = 6;
  string session_id = 7;
  uint32 connection_attempt = 8;
  uint64 issued_at_unix_ms = 9;
  bytes request_nonce = 10;
  bytes node_signature = 90;
}

message ResumeLeaseResult {
  ResumeOutcome outcome = 1;
  Lease lease = 2;
  string detail = 3;
  uint32 retry_after_ms = 4;
  uint32 schema_version = 5;
  string coordinator_id = 6;
  uint64 issued_at_unix_ms = 7;
  bytes request_nonce = 8;
  bytes coordinator_signature = 90;
}

enum ResumeOutcome {
  RESUME_OUTCOME_UNSPECIFIED = 0;
  RESUME_OUTCOME_RESUMED = 1;
  RESUME_OUTCOME_REVOKED = 2;
  RESUME_OUTCOME_EXPIRED = 3;
  RESUME_OUTCOME_SUPERSEDED = 4;
  RESUME_OUTCOME_UNKNOWN_LEASE = 5;
  RESUME_OUTCOME_IDENTITY_CONFLICT = 6;
  RESUME_OUTCOME_UNAVAILABLE = 7;
  RESUME_OUTCOME_EPOCH_AHEAD = 8;
  // ★ 2026-10-03 12:35 (실행 알림 계약 §8 · 계획 조각 6c) — 그 Lease 의 시도가 실행 여부 불명(RUN_UNKNOWN — 보류)이다.
  // 도는지 모르는 작업의 Lease 를 이어 주지 않는다. Agent 는 즉시 멈추고 되풀이하지 않는다.
  // REVOKED(Coordinator 가 영속적으로 폐기한 Lease)와 섞지 않는다 — 보류는 STOP_CONFIRMED 가 푼다.
  RESUME_OUTCOME_RUN_UNKNOWN_HELD = 9;
}

enum RenewOutcome {
  RENEW_OUTCOME_UNSPECIFIED = 0;
  RENEW_OUTCOME_RENEWED = 1;
  // 더 높은 fence_epoch의 lease가 이미 존재한다. 이 노드는 stale이다.
  // 정상적인 failover 경합이므로 risk signal을 발화하지 않는다.
  RENEW_OUTCOME_SUPERSEDED = 2;
  RENEW_OUTCOME_QUARANTINED = 3;
  RENEW_OUTCOME_JOB_CANCELLED = 4;
  RENEW_OUTCOME_JOB_COMPLETED = 5;
  // max_total_duration_seconds 초과. 새 lease를 요청해야 한다.
  RENEW_OUTCOME_MAX_DURATION_EXCEEDED = 6;
  // quorum 상실 등. 재시도 가능.
  RENEW_OUTCOME_UNAVAILABLE = 7;
  // Coordinator가 영속적으로 revoke한 Lease. 새 Lease를 요청해야 한다.
  RENEW_OUTCOME_REVOKED = 8;
  // ★ 2026-10-03 12:35 (실행 알림 계약 §8 · 계획 조각 6c) — 그 Lease 의 시도가 실행 여부 불명(RUN_UNKNOWN — 보류)이다.
  // 만료시각을 늘리지 않는다. Agent 는 즉시 멈추고(지우지 않는다) 되풀이하지 않는다. REVOKED 와 섞지 않는다.
  RENEW_OUTCOME_RUN_UNKNOWN_HELD = 9;
}

// ═══════════════════════════════════════════════════════════════════════
// 명시적 회수
// ═══════════════════════════════════════════════════════════════════════

message RevokeLeaseNotice {
  uint32 schema_version = 1;
  string lease_id = 2;
  uint64 fence_epoch = 3;
  RevokeCause cause = 4;
  uint64 issued_at_unix_ms = 5;
  // domain_tag = "gputeer/v1/lease-revoke"
  bytes coordinator_signature = 90;
}

enum RevokeCause {
  REVOKE_CAUSE_UNSPECIFIED = 0;
  REVOKE_CAUSE_QUARANTINE = 1;
  REVOKE_CAUSE_JOB_CANCELLED = 2;
  REVOKE_CAUSE_DRAIN = 3;
  REVOKE_CAUSE_SUPERSEDED = 4;
  REVOKE_CAUSE_OWNER_PREEMPT = 5; // 노드 소유자가 "지금 비우기" 실행
}

// ═══════════════════════════════════════════════════════════════════════
// Fence Watermark — 영속화 대상 (v5 초안 누락)
//
// 자원 측(Agent, Hub, CAS)은 자신이 본 최대 fence_epoch를 유지한다.
// 이것이 영속화되지 않으면 재시작한 노드가 stale lease를 수락한다.
//
// 저장 위치
//   Agent       로컬 SQLite `fence_watermark` 테이블
//   Hub         자체 메타데이터 DB
//   Coordinator ControlStore (복제 대상)
//
// 갱신 시점
//   더 높은 epoch의 유효한 요청을 수락하기 "직전"에 fsync 한다.
// ═══════════════════════════════════════════════════════════════════════

message FenceWatermark {
  string team_id = 1;
  uint64 max_seen_epoch = 2;
  uint64 updated_at_unix_ms = 3;
}

// ═══════════════════════════════════════════════════════════════════════
// Operation ID — 같은 epoch 내 중복 구분
//
// fence_epoch만으로는 같은 attempt가 보낸 서로 다른 두 쓰기를 구분할 수 없다.
//
//   operation_id = BLAKE3(job_id || attempt_id || uint64_be(operation_seq))
//
// Hub / CAS는 (fence_epoch, operation_id)로 중복을 판정한다.
// 같은 operation_id의 재전송은 멱등하게 처리한다 (재시도 안전).
// IDEMPOTENT Job은 이 값을 외부 API의 멱등 키로 전달한다.
// ═══════════════════════════════════════════════════════════════════════

message FencedOperation {
  uint64 fence_epoch = 1;
  Digest operation_id = 2;
  uint64 operation_seq = 3;
}

// ═══════════════════════════════════════════════════════════════════════
// NodeHeartbeat — 노드가 살아 있음을 스스로 알린다
//
// ADR-033 §7 은 노드 생존 확인을 두 층으로 나눈다.
//
//   관측(신고)   같은 풀의 이웃이 "저 노드에 연락이 안 된다" 고 보고
//   판정(결정)   Broker/Coordinator 가 그 보고를 모아 상태를 정한다
//
// 이 메시지는 그 **앞 단계**다 — 노드 자신의 생존 보고. 이것이 있어야
// NodeRecord.last_heartbeat_unix_ms 를 채울 값이 생긴다. 그 필드는
// proto/control.proto:508 에 진작 있었지만 채우는 메시지가 없었다.
//
// ★ 자기보고다. provenance 는 WORKER_REPORTED 이며 위조 가능하다는
//   전제로 다룬다(CLAUDE.md §1). 서명은 "이 장치가 보냈다" 를 증명할 뿐
//   "이 장치가 건강하다" 를 증명하지 않는다.
//
// ★ 이웃 신고(ADR-033 §7 의 관측 층)는 아래 NeighborUnreachableReport 다.
//   초안은 "pool membership 이 먼저 있어야 한다" 며 미뤘는데, 정확히는
//   **메시지 정의와 멤버십 해소가 다른 일**이다 — 서명된 관측을 주고받는
//   것은 지금 정의할 수 있고, "이 신고자가 정당한 이웃인가" 는 여전히
//   해소 못 한다. 그 구분을 지켜서 앞의 것만 넣는다.
// ═══════════════════════════════════════════════════════════════════════

message NodeHeartbeat {
  uint32 schema_version = 1;
  string node_id = 2;
  string device_id = 3;
  // 이 노드가 지금 붙어 있는 Coordinator. 다른 Coordinator 로 보낸
  // heartbeat 를 재사용할 수 없게 한다.
  string coordinator_device_id = 4;
  uint64 issued_at_unix_ms = 5;
  // 이 노드가 지금 들고 있는 Lease 의 fence epoch. 0 이면 없다.
  //
  // 이 값이 있으면 Coordinator 는 "살아 있다" 뿐 아니라 "어느 세대의
  // 작업을 들고 살아 있다" 를 안다 — 오래된 세대의 heartbeat 를
  // 최신 상태로 오인하지 않는다.
  uint64 fence_epoch = 6;
  // 지금 이 노드에서 도는 attempt 수. 관측값이며 정책 판정이 아니다.
  uint32 running_attempts = 7;
  bytes request_nonce = 8;
  bytes node_signature = 90;
}

// ═══════════════════════════════════════════════════════════════════════
// 이웃 신고 — ADR-033 §7 의 관측 층
// ═══════════════════════════════════════════════════════════════════════
//
// 같은 풀의 이웃이 "저 노드에 연락하지 못한다" 고 서명해 보고한다.
//
// ★ 이것은 **권한이 아니라 입력이다.** 신고가 여러 건 모여도 그 자체로는
//   어떤 예약도 무효화하지 않는다. 판정과 재배정은 ADR-033 §1 대로
//   Broker 가 하고, 재배정 조건은 §8 이 정한다
//   (crates/scheduler/src/reassignment.rs 가 그 관문이다).
//
// ★ **"연락이 안 된다" 는 "죽었다" 가 아니다.** 네트워크가 갈라졌으면
//   대상 노드는 멀쩡히 실행 중이다. 그래서 이 메시지에는 판정을 담는
//   필드가 **하나도 없다** — is_dead 같은 것을 넣으면 관측이 판정으로
//   승격되고, §7 이 금지한 것이 정확히 그것이다. 담기는 것은 신고자가
//   본 사실뿐이다.
//
// ★ 자기보고가 아니라 **타자 관측**이다. NodeHeartbeat 과 신뢰 모델이
//   다르다 — heartbeat 는 도착하면 "살아 있다" 의 강한 증거지만 안 오는
//   것은 약한 증거다. 이 신고는 바로 그 약한 쪽을 보강한다. 그러나
//   신고자도 거짓말할 수 있으므로(ADR-033 §7 의 "감염된 멤버"), 정족수와
//   자기편향 분리가 §8 관문에 있다.

message NeighborUnreachableReport {
  uint32 schema_version = 1;
  // 신고한 **기계**. ADR-033 §8 조건 3 의 정족수("이웃 N 대")는 이
  // 값의 서로 다른 개수로 센다 — 멤버 수가 아니다.
  string reporter_node_id = 2;
  // 신고한 기계의 장치 신원. 서명자와 대조한다.
  string reporter_device_id = 3;
  // 연락이 안 된다고 지목된 노드.
  //
  // ★ 지목당했다는 것 자체는 그 노드에 대한 어떤 판정도 아니다.
  string unreachable_node_id = 4;
  // 이 신고를 받는 Coordinator.
  //
  // ★ canonical 에 들어가므로 **변조**는 막힌다. 그러나 "다른
  //   Coordinator 로 보낸 신고를 재사용할 수 없다" 는 보장은 아니다 —
  //   프레이밍 계층은 이 값을 자기 ID 와 대조하지 않는다. **소비자가
  //   반드시 대조해야 한다**(2026-08-30 독립 검수 지적, CLAUDE.md §0.4).
  string coordinator_device_id = 5;
  // 신고자가 관측한 시각.
  uint64 observed_at_unix_ms = 6;
  bytes request_nonce = 7;
  bytes reporter_signature = 90;

  // ★ 초안에는 last_contact_at_unix_ms 와 failed_attempt_count 도 있었는데
  //   **뺐다**(독립 검수 지적). ADR-033 §7·§8 이 요구하지 않고 소비자도
  //   없는데, `last_contact_at > observed_at` 같은 모순된 값도 서명만
  //   맞으면 통과해 공격 입력면만 넓혔다(RULE.md YAGNI). 판정에 필요해지면
  //   그때 계약을 정하고 내부 일관성 거부와 함께 넣는다.
}

// ═══════════════════════════════════════════════════════════════════════
// 대체 통지 우편함 (2026-10-02)
//   제안 docs/contracts/proposals/2026-10-02_2207_대체_통지_우편함.md v3 — "그 시도는 폐기됐다" 를 서명해 영속하고, 옛 노드가 새 작업 전에 처리한다.
//   enum 은 최상위에 둔다 — 지문 파서가 중첩 선언을 못 읽는다(signing.md §7.3).
// ═══════════════════════════════════════════════════════════════════════

// 왜 폐기했나. 0 · 모르는 값은 거부한다.
enum SupersedeCause {
  SUPERSEDE_CAUSE_UNSPECIFIED = 0;
  // 장애 이어받기(failover)가 응답 없는 노드의 Lease 를 폐기했다.
  SUPERSEDE_CAUSE_NODE_LOST = 1;
}

// 폐기와 같은 커밋에서 Job 을 어떻게 했나. 0 · 모르는 값은 거부한다.
enum SupersedeJobDisposition {
  SUPERSEDE_JOB_DISPOSITION_UNSPECIFIED = 0;
  // 이어갈 체크포인트가 있어 큐로 되돌렸다.
  SUPERSEDE_JOB_DISPOSITION_REQUEUED = 1;
  // 이어갈 것이 없어 실패로 뒀다.
  SUPERSEDE_JOB_DISPOSITION_FAILED = 2;
}

// 노드가 통지를 어떻게 처리했나. 0 · 모르는 값은 거부한다.
enum MailboxAction {
  MAILBOX_ACTION_UNSPECIFIED = 0;
  // 돌던 것을 멈췄다 — 정지가 성공한 뒤에만.
  MAILBOX_ACTION_STOPPED = 1;
  // 원장과 실행 목록을 대조해 이 노드에서 돌지 않는다고 확인했다.
  MAILBOX_ACTION_NOT_RUNNING = 2;
}

// FrameType 21 · Coordinator 서명 · Evidence(만료 · replay 캐시 없음 — 며칠 뒤 전해져도 유효. 재전달은 소비 측 멱등 키 notice_id).
// 조합 규칙(서명 검증 뒤): node_id = 받는 노드 · cause · job_disposition ≠ 0 · issued_at = decided_at · notice_id 가 아래 식으로 다시 계산한 값과 같다.
//   `gputeer_protocol::mailbox_rules`.
message SupersedeNotice {
  uint32 schema_version = 1; // 현재 1
  // hex(BLAKE3-256("gputeer/supersede-notice-id/v1\0" · u32 BE 길이 + attempt_id · u32 BE 길이 + node_id · u64 BE fence_epoch)).
  string notice_id = 2;
  // 폐기된 옛 시도의 신원.
  string job_id = 3;
  string attempt_id = 4;
  string node_id = 5;
  uint64 fence_epoch = 6;
  string lease_id = 7;
  SupersedeCause cause = 8;
  SupersedeJobDisposition job_disposition = 9;
  // 폐기를 커밋한 Coordinator 시각 — Evidence 의 관측 시각(signing.md §9.1).
  uint64 decided_at_unix_ms = 10;
  string coordinator_id = 11;
  // = decided_at_unix_ms.
  uint64 issued_at_unix_ms = 12;
  // domain_tag = "gputeer/v1/supersede-notice"
  bytes coordinator_signature = 90;
}

// FrameType 22 · Coordinator 서명 · ShortLived(만료 issued_at + GRANT_TTL_MS · replay nonce = session_nonce — MAILBOX 세션 Hello 의 nonce echo).
// ★ 겉 서명(이 세션 · 지금 · 이 목록이 전부)과 안의 통지 서명(영속 사실)을 **각각** 검증한다 — Grant 안의 Lease 와 같은 방식(규칙 i).
message MailboxDelivery {
  uint32 schema_version = 1; // 현재 1
  // = Hello 의 node_id.
  string node_id = 2;
  // 그 노드 앞으로 와서 받아들여진 답이 없는 것 **전부**(decided_at 오래된 순 · notice_id 중복 없음). 비면 "지금 우편함은 비었다".
  repeated SupersedeNotice notices = 3;
  string coordinator_id = 4;
  uint64 issued_at_unix_ms = 5;
  bytes session_nonce = 6;
  // domain_tag = "gputeer/v1/mailbox-delivery"
  bytes coordinator_signature = 90;
}

// 답 한 줄. 서명하지 않는다 — 싣는 MailboxAck 의 서명이 묶는다.
message SupersedeHandled {
  string notice_id = 1;
  // 그 통지의 BLAKE3-256(sig_input). Coordinator 가 배달한 통지와 대조한다.
  Digest notice_hash = 2;
  MailboxAction action = 3;
}

// FrameType 23 · 노드 서명 · ShortLived(만료 issued_at + GRANT_TTL_MS · replay nonce = session_nonce — 같은 세션의 Hello nonce).
message MailboxAck {
  uint32 schema_version = 1; // 현재 1
  // = Hello 의 node_id = 서명자.
  string node_id = 2;
  // 그 세션에서 실제로 배달된 통지만 · 중복 없음.
  repeated SupersedeHandled handled = 3;
  uint64 issued_at_unix_ms = 4;
  bytes session_nonce = 5;
  // domain_tag = "gputeer/v1/mailbox-ack"
  bytes node_signature = 90;
}

// FrameType 24 · Coordinator 서명 · ShortLived(만료 issued_at + GRANT_TTL_MS · replay nonce = session_nonce).
// 수신 확인을 받은 notice_id 는 "처리 끝" 이다. 못 받았으면 다음 MAILBOX 세션의 배달을 본다 — 거기 없으면 커밋됐다 · 있으면 커밋되지 않았다.
message MailboxAckReceipt {
  uint32 schema_version = 1; // 현재 1
  string node_id = 2;
  // 이번 답으로 받아들여 커밋한 notice_id(답의 handled 의 부분집합).
  repeated string accepted = 3;
  string coordinator_id = 4;
  uint64 issued_at_unix_ms = 5;
  bytes session_nonce = 6;
  // domain_tag = "gputeer/v1/mailbox-receipt"
  bytes coordinator_signature = 90;
}
