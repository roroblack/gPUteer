[package]
name = "gputeer-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gputeer-protocol = { path = "../protocol" }
gputeer-crypto = { path = "../crypto" }
gputeer-checkpoint = { path = "../checkpoint" }
gputeer-runtime-policy = { path = "../runtime-policy" }
gputeer-runtime-nvml = { path = "../runtime-nvml" }
prost.workspace = true
serde_json.workspace = true
blake3.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true

# 가짜 컨테이너 런타임이 이 시험 실행 파일 자신이다 — main 을 직접 쓴다.
[[test]]
name = "container_lifecycle"
harness = false

[target.'cfg(windows)'.dependencies]
gputeer-runtime-windows = { path = "../runtime-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
gputeer-runtime-linux = { path = "../runtime-linux" }
