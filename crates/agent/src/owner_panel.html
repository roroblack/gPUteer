<!doctype html>
<meta charset="utf-8">
<title>gPUteer — 내 GPU</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .5rem .6rem; text-align: left; font-size: .9rem; }
  th { background: #f4f4f4; }
  .loss { font-weight: 600; }
  .unknown { color: #b00; }
  .empty { color: #666; margin-top: 1rem; }
  button { padding: .4rem .8rem; cursor: pointer; }
  #error { color: #b00; margin-top: 1rem; white-space: pre-wrap; }
  .conn-ok { color: #080; }
  .conn-lost { color: #b00; font-weight: 600; }
  .banner { background: #fff3cd; border: 1px solid #e0b000; padding: .6rem .8rem; margin-top: 1rem; }
</style>

<h1>내 GPU 에서 도는 작업</h1>
<p>이 화면은 이 컴퓨터에서만 열린다. 네트워크가 끊겨도, 중개 서버가 죽어도 동작한다.</p>

<div id="content"><p class="empty">불러오는 중…</p></div>
<div id="error"></div>

<script>
  // ★ 토큰은 서버가 목록과 함께 준다. 이 페이지는 같은 출처에서만
  //   열리므로 토큰을 받을 수 있고, 다른 사이트는 CORS 때문에
  //   이 응답을 읽지 못한다.
  let token = null;

  function fmtDuration(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + "초";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "분 " + (s % 60) + "초";
    return Math.floor(m / 60) + "시간 " + (m % 60) + "분";
  }

  async function refresh() {
    try {
      const res = await fetch("/api/workloads", { cache: "no-store" });
      if (!res.ok) throw new Error("목록을 못 받았다: " + res.status);
      const data = await res.json();
      token = data.token;
      render(data.workloads);
      document.getElementById("error").textContent = "";
    } catch (e) {
      document.getElementById("error").textContent = String(e);
    }
  }

  function render(items) {
    const box = document.getElementById("content");
    if (!items.length) {
      box.innerHTML = '<p class="empty">지금 도는 작업이 없다.</p>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML =
      "<tr><th>누가</th><th>어느 작업</th><th>무엇을</th>" +
      "<th>언제부터</th><th>지금 멈추면 잃는 것</th><th>중개 서버 연결</th><th></th></tr>";
    const lost = items.filter(it => it.connection && (it.connection.disconnected || it.connection.refused) && !it.connection.self_stopped);
    for (const it of items) {
      const row = table.insertRow();
      // textContent 로만 넣는다 — 제출자가 정한 문자열이 화면에서
      // 코드로 해석되면 안 된다.
      row.insertCell().textContent = it.submitter_device_id;
      row.insertCell().textContent = it.job_id;
      row.insertCell().textContent = it.entrypoint;
      row.insertCell().textContent = fmtDuration(it.running_ms) + " 전";

      const loss = row.insertCell();
      loss.className = "loss";
      // ★ 확정된 체크포인트가 없으면 그 사실을 반드시 함께 보인다.
      //   숫자만 보면 "조금만 잃는다" 로 오해한다.
      loss.textContent = it.nothing_committed_yet
        ? "최대 " + fmtDuration(it.lost_ms) + " (저장된 지점이 아직 없다 — 처음부터 다시)"
        : "최대 " + fmtDuration(it.lost_ms);
      if (it.nothing_committed_yet) loss.classList.add("unknown");

      // ★ 2026-09-30 — 연결 상태 · 끊김 시한 · 소유자 선택(끊겨도 소유자가 멈추거나 계속 돌리기를 고른다).
      const conn = row.insertCell();
      const c = it.connection;
      if (!c) {
        conn.textContent = "감시 없음";
      } else if (c.self_stopped) {
        conn.className = "conn-lost";
        conn.textContent = "끊김 시한에 스스로 멈췄다";
      } else if (c.refused) {
        conn.className = "conn-lost";
        conn.textContent = "중개 서버가 다른 노드로 넘겼다 — 곧 멈춘다";
      } else if (c.disconnected) {
        conn.className = "conn-lost";
        conn.textContent = c.keep_running
          ? "끊김 " + fmtDuration(c.since_last_ok_ms) + " — 소유자가 계속 돌리기를 골랐다(다른 노드에서도 돌 수 있다)"
          : "끊김 " + fmtDuration(c.since_last_ok_ms) + " — " + fmtDuration(c.ms_to_self_stop) + " 뒤 스스로 멈춘다";
      } else {
        conn.className = "conn-ok";
        conn.textContent = "연결됨";
      }

      const action = row.insertCell();
      const button = document.createElement("button");
      button.textContent = "지금 비우기";
      button.onclick = () => stop(it);
      action.appendChild(button);
      if (c && c.disconnected && !c.refused && !c.self_stopped && !c.keep_running) {
        const keep = document.createElement("button");
        keep.textContent = "계속 돌리기";
        keep.disabled = !c.keep_running_allowed;
        keep.title = c.keep_running_allowed
          ? "끊긴 채로 계속 돌린다 — 중개 서버가 다른 노드에 다시 맡기면 두 곳에서 돈다"
          : "부작용이 있는 작업은 두 번 실행을 막을 수 없어 계속 돌릴 수 없다";
        keep.onclick = () => keepRunning(it);
        action.appendChild(keep);
      }
    }
    if (lost.length) {
      const banner = document.createElement("div");
      banner.className = "banner";
      banner.textContent = "중개 서버와 연결이 끊긴 작업이 " + lost.length + "개 있다. 그대로 두면 시한에 스스로 멈춘다. " +
        "지금 비우거나, 부작용 없는 작업은 계속 돌리기를 고를 수 있다.";
      box.replaceChildren(banner, table);
    } else {
      box.replaceChildren(table);
    }
  }

  async function stop(item) {
    const lossText = item.nothing_committed_yet
      ? "저장된 지점이 아직 없어 처음부터 다시 해야 한다 (약 " + fmtDuration(item.lost_ms) + " 진행분)"
      : "최대 " + fmtDuration(item.lost_ms) + " 진행분을 잃는다";
    // ★ 손실 범위를 누르기 전에 다시 보여준다(§0.1).
    if (!confirm(item.job_id + " 를 지금 멈춘다.\n" + lossText + "\n\n계속할까?")) return;
    try {
      const res = await fetch("/api/stop", {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: item.attempt_id,
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      // 실패를 조용히 넘기지 않는다 — 소유자가 멈춘 줄 알면 안 된다.
      document.getElementById("error").textContent = "멈추지 못했다: " + String(e);
    }
    refresh();
  }

  async function keepRunning(item) {
    if (!confirm(item.job_id + " 를 끊긴 채로 계속 돌린다.\n중개 서버가 이 작업을 다른 노드에 다시 맡기면 두 곳에서 돈다(결과는 나중에 하나로 정리된다).\n\n계속할까?")) return;
    try {
      const res = await fetch("/api/keep-running", {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: item.attempt_id,
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      document.getElementById("error").textContent = "계속 돌리기를 고르지 못했다: " + String(e);
    }
    refresh();
  }

  refresh();
  setInterval(refresh, 2000);
</script>
