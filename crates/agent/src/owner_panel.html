<!doctype html>
<meta charset="utf-8">
<title>gPUteer — 내 GPU</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .5rem .6rem; text-align: left; font-size: .9rem; }
  th { background: #f4f4f4; }
  .loss { font-weight: 600; }
  .unknown { color: #b00; }
  .empty { color: #666; margin-top: 1rem; }
  button { padding: .4rem .8rem; cursor: pointer; }
  #error { color: #b00; margin-top: 1rem; white-space: pre-wrap; }
  .conn-ok { color: #080; }
  .conn-lost { color: #b00; font-weight: 600; }
  .banner { background: #fff3cd; border: 1px solid #e0b000; padding: .6rem .8rem; margin-top: 1rem; }
</style>

<h1>내 GPU 에서 도는 작업</h1>
<p>이 화면은 이 컴퓨터에서만 열린다. 네트워크가 끊겨도, 중개 서버가 죽어도 동작한다.</p>

<div class="banner" id="announce-box">
  <b>곧 인터넷이 끊기나요?</b> (노트북 이동 등) 끊길 시간을 미리 알리면, 중개 서버가 허락한 만큼 작업이 끊긴 동안에도 계속 돈다.
  <input id="announce-minutes" type="number" min="1" max="1440" value="30" style="width:5rem"> 분
  <button onclick="announce()">미리 알리기</button> <button onclick="announceCancel()">알림 취소</button>
  <div id="announce-status"></div>
</div>
<div id="content"><p class="empty">불러오는 중…</p></div>
<div id="error"></div>

<script>
  // ★ 토큰은 서버가 목록과 함께 준다. 이 페이지는 같은 출처에서만
  //   열리므로 토큰을 받을 수 있고, 다른 사이트는 CORS 때문에
  //   이 응답을 읽지 못한다.
  let token = null;

  function fmtDuration(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + "초";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "분 " + (s % 60) + "초";
    return Math.floor(m / 60) + "시간 " + (m % 60) + "분";
  }

  async function refresh() {
    try {
      const res = await fetch("/api/workloads", { cache: "no-store" });
      if (!res.ok) throw new Error("목록을 못 받았다: " + res.status);
      const data = await res.json();
      token = data.token;
      renderAnnouncement(data.announcement, data.now_unix_ms);
      render(data.workloads);
      document.getElementById("error").textContent = "";
    } catch (e) {
      document.getElementById("error").textContent = String(e);
    }
  }

  function render(items) {
    const box = document.getElementById("content");
    if (!items.length) {
      box.innerHTML = '<p class="empty">지금 도는 작업이 없다.</p>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML =
      "<tr><th>누가</th><th>어느 작업</th><th>무엇을</th>" +
      "<th>언제부터</th><th>진행(작업 자기보고)</th><th>지금 멈추면 잃는 것</th><th>중개 서버 연결</th><th></th></tr>";
    const lost = items.filter(it => it.connection && (it.connection.disconnected || it.connection.refused) && !it.connection.self_stopped);
    for (const it of items) {
      const row = table.insertRow();
      // textContent 로만 넣는다 — 제출자가 정한 문자열이 화면에서
      // 코드로 해석되면 안 된다.
      row.insertCell().textContent = it.submitter_device_id;
      row.insertCell().textContent = it.job_id;
      row.insertCell().textContent = it.entrypoint;
      row.insertCell().textContent = fmtDuration(it.running_ms) + " 전";

      // ★ 2026-10-01 — 진행은 작업이 스스로 적은 값이다(검증되지 않음). 없으면 "보고 없음".
      const prog = row.insertCell();
      const p = it.progress;
      if (!p || !p.last) {
        prog.textContent = p && p.error ? "형식 오류: " + p.error : "보고 없음";
      } else {
        const l = p.last;
        // 적지 않은 값은 null 이다 — 0 으로 보이지 않는다.
        let text = l.total_steps ? l.current_step + "/" + l.total_steps + " (" + Math.floor(l.current_step * 100 / l.total_steps) + "%)" : "단계 " + l.current_step + " (전체 모름)";
        if (l.eta_seconds) text += " · 남은 예상 " + fmtDuration(l.eta_seconds * 1000);
        text += " · " + fmtDuration(p.age_ms) + " 전 보고";
        if (p.error) text += " · 최근 형식 오류";
        prog.textContent = text;
      }

      const loss = row.insertCell();
      loss.className = "loss";
      // ★ 확정된 체크포인트가 없으면 그 사실을 반드시 함께 보인다.
      //   숫자만 보면 "조금만 잃는다" 로 오해한다.
      loss.textContent = it.nothing_committed_yet
        ? "최대 " + fmtDuration(it.lost_ms) + " (저장된 지점이 아직 없다 — 처음부터 다시)"
        : "최대 " + fmtDuration(it.lost_ms);
      if (it.nothing_committed_yet) loss.classList.add("unknown");

      // ★ 2026-09-30 — 연결 상태 · 끊김 시한 · 소유자 선택(끊겨도 소유자가 멈추거나 계속 돌리기를 고른다).
      const conn = row.insertCell();
      const c = it.connection;
      if (!c) {
        conn.textContent = "감시 없음";
      } else if (c.self_stopped) {
        conn.className = "conn-lost";
        conn.textContent = "끊김 시한에 스스로 멈췄다";
      } else if (c.refused) {
        conn.className = "conn-lost";
        conn.textContent = "중개 서버가 다른 노드로 넘겼다 — 곧 멈춘다";
      } else if (c.disconnected && c.near_finish) {
        // ★ 2026-10-01 (판단표 ④) — 곧 끝나는 작업은 재배치 전까지 계속 돈다. 근거는 작업 자기보고 진행이다.
        conn.className = "conn-lost";
        conn.textContent = "끊김 " + fmtDuration(c.since_last_ok_ms) + " — 곧 끝남(작업 자기보고): 약 " + fmtDuration(c.near_finish.ms_to_expected_done)
          + " 안에 끝날 것으로 보여 계속 돈다. 늦어도 " + fmtDuration(c.near_finish.ms_to_hard_stop) + " 뒤 멈춘다";
      } else if (c.disconnected) {
        conn.className = "conn-lost";
        conn.textContent = c.keep_running
          ? "끊김 " + fmtDuration(c.since_last_ok_ms) + " — 소유자가 계속 돌리기를 골랐다(다른 노드에서도 돌 수 있다)"
          : c.ms_to_self_stop === null
          ? "끊김 " + fmtDuration(c.since_last_ok_ms) + " — 시간으로는 멈추지 않는다(끊김 여유 0). 중개 서버가 넘겼다고 알리면 멈춘다"
          : "끊김 " + fmtDuration(c.since_last_ok_ms) + " — " + fmtDuration(c.ms_to_self_stop) + " 뒤 스스로 멈춘다";
      } else {
        conn.className = "conn-ok";
        conn.textContent = "연결됨";
      }

      const action = row.insertCell();
      const button = document.createElement("button");
      button.textContent = "지금 비우기";
      button.onclick = () => stop(it);
      action.appendChild(button);
      // ★ 2026-09-30 — 일시정지 · 다시 시작(검증된 수단에서만 · GPU 메모리는 쥔 채). 수단이 없으면 버튼을 끄고 이유를 보인다.
      const pauseButton = document.createElement("button");
      if (it.pause_state === "unknown") {
        // ★ 검수 pz1 — 얼리기 · 풀기를 보냈는데 확인하지 못했다. 얼어 있을 수 있다 — 다시 시작(풀기를 다시 보낸다)이나 지금 비우기를 고른다.
        pauseButton.textContent = "다시 시작";
        pauseButton.title = "일시정지 상태를 확인하지 못했다 — 풀기를 다시 보낸다";
        pauseButton.onclick = () => pauseOrResume(it, "/api/resume");
        conn.textContent = "일시정지 상태를 확인하지 못했다(얼어 있을 수 있다) · " + conn.textContent;
      } else if (it.paused) {
        pauseButton.textContent = "다시 시작";
        pauseButton.title = "중개 서버와 연결돼 있고 끊김 시한 전일 때만 다시 시작한다";
        pauseButton.onclick = () => pauseOrResume(it, "/api/resume");
        conn.textContent = "일시정지 중(GPU 메모리는 그대로 쥐고 있다) · " + conn.textContent;
      } else {
        pauseButton.textContent = "일시정지";
        pauseButton.disabled = !it.pause_supported;
        pauseButton.title = it.pause_supported
          ? "작업을 얼린다 — 계산은 멈추지만 GPU 메모리는 비우지 않는다"
          : it.pause_unsupported_reason;
        pauseButton.onclick = () => pauseOrResume(it, "/api/pause");
      }
      action.appendChild(pauseButton);
      if (c && c.disconnected && !c.refused && !c.self_stopped && !c.keep_running) {
        const keep = document.createElement("button");
        keep.textContent = "계속 돌리기";
        keep.disabled = !c.keep_running_allowed;
        keep.title = c.keep_running_allowed
          ? "끊긴 채로 계속 돌린다 — 중개 서버가 다른 노드에 다시 맡기면 두 곳에서 돈다"
          : "부작용이 있는 작업은 두 번 실행을 막을 수 없어 계속 돌릴 수 없다";
        keep.onclick = () => keepRunning(it);
        action.appendChild(keep);
      }
    }
    if (lost.length) {
      const banner = document.createElement("div");
      banner.className = "banner";
      banner.textContent = "중개 서버와 연결이 끊긴 작업이 " + lost.length + "개 있다. 그대로 두면 시한에 스스로 멈춘다. " +
        "지금 비우거나, 부작용 없는 작업은 계속 돌리기를 고를 수 있다.";
      box.replaceChildren(banner, table);
    } else {
      box.replaceChildren(table);
    }
  }

  async function stop(item) {
    const lossText = item.nothing_committed_yet
      ? "저장된 지점이 아직 없어 처음부터 다시 해야 한다 (약 " + fmtDuration(item.lost_ms) + " 진행분)"
      : "최대 " + fmtDuration(item.lost_ms) + " 진행분을 잃는다";
    // ★ 손실 범위를 누르기 전에 다시 보여준다(§0.1).
    if (!confirm(item.job_id + " 를 지금 멈춘다.\n" + lossText + "\n\n계속할까?")) return;
    try {
      const res = await fetch("/api/stop", {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: item.attempt_id,
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      // 실패를 조용히 넘기지 않는다 — 소유자가 멈춘 줄 알면 안 된다.
      document.getElementById("error").textContent = "멈추지 못했다: " + String(e);
    }
    refresh();
  }

  async function keepRunning(item) {
    if (!confirm(item.job_id + " 를 끊긴 채로 계속 돌린다.\n중개 서버가 이 작업을 다른 노드에 다시 맡기면 두 곳에서 돈다(결과는 나중에 하나로 정리된다).\n\n계속할까?")) return;
    try {
      const res = await fetch("/api/keep-running", {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: item.attempt_id,
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      document.getElementById("error").textContent = "계속 돌리기를 고르지 못했다: " + String(e);
    }
    refresh();
  }

  // ★ 2026-10-01 — 미리 알린 끊김. 알림은 요청일 뿐이고, 계속 돌 자격은 중개 서버가 서명해 준 연장으로만 생긴다.
  function renderAnnouncement(a, now) {
    const box = document.getElementById("announce-status");
    if (!a) { box.textContent = "알림 없음 — 끊기면 끊김 시한에 작업이 스스로 멈춘다."; return; }
    const until = new Date(a.until_unix_ms).toLocaleTimeString();
    if (a.granted_expires_at_unix_ms) {
      const granted = new Date(a.granted_expires_at_unix_ms).toLocaleTimeString();
      box.textContent = until + " 까지 끊긴다고 알렸다 — 중개 서버가 " + granted + " 까지 허락했다(그보다 조금 앞에서 스스로 멈춘다).";
    } else if (a.last_send_failed) {
      box.textContent = until + " 까지 끊긴다고 알렸지만 받아들여지지 않았다(연결 실패 또는 옛 중개 서버) — 연결되면 다시 보낸다.";
    } else {
      box.textContent = until + " 까지 끊긴다고 알리는 중… (작업이 돌고 있고 실행 중 갱신이 켜진 노드에서만 보낸다)";
    }
  }

  async function sendAnnouncement(minutes) {
    try {
      const res = await fetch("/api/announce-disconnect", {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: String(minutes),
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      document.getElementById("error").textContent = "알리지 못했다: " + String(e);
    }
    refresh();
  }
  function announce() { sendAnnouncement(parseInt(document.getElementById("announce-minutes").value, 10) || 0); }
  function announceCancel() { sendAnnouncement(0); }

  async function pauseOrResume(item, path) {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "x-gputeer-owner-token": token },
        body: item.attempt_id,
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      document.getElementById("error").textContent = "";
    } catch (e) {
      // 못 얼렸는데 얼린 줄 알고 자리를 비우면 안 된다 — 실패를 그대로 보인다.
      document.getElementById("error").textContent =
        (path === "/api/pause" ? "일시정지하지 못했다: " : "다시 시작하지 못했다: ") + String(e);
    }
    refresh();
  }

  refresh();
  setInterval(refresh, 2000);
</script>
