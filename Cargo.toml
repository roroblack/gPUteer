[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/checkpoint",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
