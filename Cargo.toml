[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/protocol",
    "crates/checkpoint",
    "crates/cli",
    "crates/runtime-policy",
    "crates/runtime-windows",
    "crates/runtime-nvml",
    "crates/runtime-linux",
    "crates/coordinator",
    "crates/agent",
    "crates/scheduler",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = "2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.2"

# ★ Windows 링커가 PDB 크기 한도를 넘어 `LNK1140` 으로 실패했다
#   (`gputeer-cli` 에 명령이 늘면서 2026-09-03 에 처음 발생).
#
#   완전한 디버그 정보 대신 **줄 표만** 남긴다 — 스택 트레이스의
#   파일:줄 은 그대로 나오고 변수 검사만 못 한다. 코드 의미는 안 바뀐다.
#
#   ★ 이건 빌드 환경 제약에 대한 대응이지 최적화가 아니다. 디버거로
#     변수를 봐야 하면 이 값을 잠시 `2` 로 올려 쓰면 된다.
[profile.dev]
debug = 1
