name: Canonical schema and workspace checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-schema:
    runs-on: ubuntu-latest
    steps:
      # ★★ fetch-depth: 0 이 **필수**다(2026-09-22 결함 208). 기본값은 1 —
      #   커밋 하나만 받는다. 그러면 `verify_evidence.py` 의 commit 도달 가능성
      #   검사가 **무엇을 고치든 반드시 실패**한다(과거 커밋이 아예 없으므로).
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ★ rustfmt 는 기본으로 안 깔린다 — 2026-09-18 실행이 정확히 여기서 죽었다
      #   ("'cargo-fmt' is not installed for the toolchain '1.89.0'"). components 로 받는다
      - name: Install Rust 1.89 toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install schema-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler
          python -m pip install --upgrade pip
          python -m pip install protobuf blake3

      - name: Run canonical reference self-test
        run: python tools/canonical/reference_canonical.py --self-test

      - name: Verify canonical vectors
        run: python tools/canonical/reference_canonical.py --verify tests/vectors/canonical_v1.json

      - name: Check canonical schema against proto definitions
        run: python tools/canonical/check_schema.py

      # ★★ 이 단계는 **지금 실패한다.** 도구가 없어서가 아니라 서식이 실제로 어긋나 있어서다 —
      #   개발 기계 실측으로 워크스페이스에 차이가 501곳이다(2026-09-18 · "Diff in" 줄 수).
      #   끄지 않는다. 검사를 끄면 빚이 보이지 않게 될 뿐이다.
      #   -> 열린 가지들을 합친 뒤 `cargo fmt --all` 일괄 정리를 한 번에 한다(그 전에 하면 전부 충돌한다).
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace excluding Windows runtime
        run: cargo build --workspace --exclude gputeer-runtime-windows

      - name: Test workspace excluding Windows runtime
        run: cargo test --workspace --exclude gputeer-runtime-windows

      # ★★ 환경 때문에 **건너뛴** 시험을 눈에 보이게 한다(2026-09-22).
      #   cargo 는 통과한 시험의 출력을 삼키므로, 관문에 걸려 측정하지 못한 시험도
      #   로그에서는 그냥 `ok` 로 보인다 — `CLAUDE.md` §4 가 금지하는
      #   "ENVIRONMENT-BLOCKED 를 PASS 로 계상" 이 **숫자 안에서** 일어난다.
      #   막지는 않는다(환경 사실이다). 다만 몇 건이 빠졌는지는 읽을 수 있어야 한다.
      - name: 환경 때문에 건너뛴 시험 (정보용)
        run: |
          cargo test -p gputeer-crypto --test keyring -- --nocapture 2>&1 | grep -F "ENVIRONMENT-BLOCKED" || true
          cargo test -p gputeer-runtime-linux --test cgroup_enforcement -- --nocapture 2>&1 | grep -F "ENVIRONMENT-BLOCKED" || true
          cargo test -p gputeer-agent --test container_isolation_real -- --nocapture 2>&1 | grep -E "ENVIRONMENT-BLOCKED|CONTAINER_ISOLATION_MEASURED" || true

      - name: Verify evidence schema
        run: python scripts/verify_evidence.py

      - name: 문서 구조·주장 검사
        run: python scripts/check_docs.py

      # 검사표가 공허하지 않은지 — 각 줄을 뒤집어 실패하는지 본다
      - name: 주장 검사표 뒤집기 시험
        run: python scripts/claims_selftest.py
